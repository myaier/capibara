<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Agent Observatory — Development Fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; width: 100%; height: 100%; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      #root { display: flex; flex-direction: column; }
      .host-bar { flex: 0 0 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; }
      .host-bar .fixture-note { margin-left: auto; font-size: 11px; }
      .plugin-frame { flex: 1; min-height: 0; display: flex; }
      .plugin-frame > div { flex: 1; min-width: 0; }
    </style>
  </head>
  <body><div id="root"></div><script src="/app.js"></script></body>
</html>
